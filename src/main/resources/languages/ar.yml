# Starter language file. You can customize every line for this locale.
language-name: "العربية"
prefix: "&8[&bSotarPayments&8] &f"

general:
  player-only: "{prefix}&cThis command can only be used in game."
  no-permission: "{prefix}&cYou do not have permission to use this command."
  invalid-number: "{prefix}&cThe entered value is invalid."
  command-not-found: "{prefix}&cUnknown command. Use &e/sotar-admin help&c for help."
  click-copy: "&7Click to put this value into your chat box."
  'yes': "Yes"
  'no': "No"
  valid: "Valid"
  invalid: "Invalid"
  enabled: "Enabled"
  disabled: "Disabled"
  currency: "VND"
  no-limit: "no limit"
  feature-unavailable: "{prefix}&cThis feature is currently unavailable. Please contact an administrator."

admin:
  reload-success: "{prefix}&aConfiguration reloaded."
  manual-usage: "{prefix}&cUsage: &f/sotar-admin napthucong <player> <amount>"
  reset-usage: "{prefix}&cUsage: &f/sotar-admin reset topnap confirm"
  reset-confirm: "{prefix}&ePlease confirm with: &f/sotar-admin reset topnap confirm"
  reset-invalid: "{prefix}&cInvalid reset option."
  player-not-found: "{prefix}&cThe player is not online or the name is incorrect."
  amount-positive: "{prefix}&cAmount must be greater than 0."
  status:
    - "&8&m----------------------------------------"
    - "&bSotarPayments &8• &fحالة النظام"
    - " "
    - "&7المنصة: &f{platform}"
    - "&7اللغة: &f{language}"
    - "&7شحن البنك: &f{bank_provider} &8(&bQR only&8)"
    - "&7شحن البطاقة: &f{card_provider}"
    - "&7فحص المعاملات: &f{poll_every}s"
    - "&7مهلة المعاملة: &f{timeout}s"
    - "&7Webhook: {webhook}"
    - "&7PlaceholderAPI: {placeholder}"
    - "&8&m----------------------------------------"
  help:
    - "&8&m----------------------------------------"
    - "&bSotarPayments"
    - "&7Bank QR, prepaid card and revenue management system."
    - " "
    - "&fPlayer commands:"
    - "&8- &e/bank <amount> &7Create a bank transfer QR code."
    - "&8- &e/napthe <type> <amount> [serial] [code] &7Top up by card."
    - "&8- &e/topnap [all|week|month] &7View top-up rankings."
    - "&8- &e/lichsunap &7View your top-up history."
    - "&8- &e/mocnap canhan &7View and claim milestone rewards."
    - " "
    - "&fAdmin commands:"
    - "&8- &e/sotar-admin status &7عرض حالة تشغيل الإضافة."
    - "&8- &e/sotar-admin reload &7Reload configuration."
    - "&8- &e/sotar-admin gui &7Open the admin dashboard."
    - "&8- &e/sotar-admin napthucong <player> <amount> &7Manual top-up."
    - "&8- &e/sotar-admin lichsunap <player> &7View a player's top-up history."
    - "&8- &e/sotar-admin reset topnap confirm &7Reset top-up data."
    - "&8&m----------------------------------------"
bank:
  usage: "{prefix}&cUsage: &f/bank <amount>"
  cancel-success: "{prefix}&eTransaction cancelled and QR map removed."
  creating: "{prefix}&eCreating transaction, please wait..."
