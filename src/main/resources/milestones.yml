# =============================================================
# SotarPayments - MỐC NẠP
# =============================================================

milestones:
  '50000':
    rewards: ["give %player% diamond 5"]
  '100000':
    rewards: ["give %player% diamond 10"]
  '150000':
    rewards: ["give %player% diamond 15"]
  '200000':
    rewards: ["give %player% diamond 20"]
  '500000':
    rewards:
      - "give %player% diamond 32"
      - "broadcast &bSotarPayments &8» &f%player% vừa đạt mốc nạp &a500,000 VNĐ."
  '1000000':
    rewards:
      - "eco give %player% 200000"
      - "broadcast &bSotarPayments &8» &f%player% vừa đạt mốc nạp &a1,000,000 VNĐ."
  '2000000':
    rewards:
      - "eco give %player% 500000"
      - "broadcast &bSotarPayments &8» &f%player% vừa đạt mốc nạp &a2,000,000 VNĐ."

server-milestones:
  enabled: true
  active-target: 1000000
  anti-clone:
    enabled: true
    minimum-personal-donated: 20000
    new-player-only: true
  bossbar:
    enabled: true
    color: BLUE
    style: SEGMENTED_10
    update-interval-ticks: 100
    progress-title: "&bMốc nạp server &8» &f{current}&7/&a{target} VNĐ &8(&e{percent}%&8)"
    reached-title: "&aMáy chủ đã đạt mốc nạp &e{target} VNĐ&a. &eDùng /mocnap server để nhận."
  milestones:
    # minimum-personal-donated: điều kiện riêng, áp dụng cho mọi người chơi.
    # Xóa key này để dùng anti-clone mặc định ở trên; đặt 0 để tắt cho riêng mốc.
    # display-rewards chỉ dùng để mô tả trên GUI; rewards mới là lệnh thực thi.
    '1000000':
      minimum-personal-donated: 20000
      display-rewards:
        - "&b5x Diamond"
      rewards: ["give %player% diamond 5"]
    '2000000':
      minimum-personal-donated: 40000
      display-rewards:
        - "&b10x Diamond"
        - "&a100,000 tiền ingame"
      rewards:
        - "give %player% diamond 10"
        - "eco give %player% 100000"
    '3000000':
      minimum-personal-donated: 60000
      display-rewards:
        - "&b15x Diamond"
        - "&a200,000 tiền ingame"
      rewards:
        - "give %player% diamond 15"
        - "eco give %player% 200000"
    '4000000':
      minimum-personal-donated: 80000
      display-rewards:
        - "&b20x Diamond"
        - "&a300,000 tiền ingame"
      rewards:
        - "give %player% diamond 20"
        - "eco give %player% 300000"
    '5000000':
      minimum-personal-donated: 100000
      display-rewards:
        - "&b32x Diamond"
        - "&a500,000 tiền ingame"
      rewards:
        - "give %player% diamond 32"
        - "eco give %player% 500000"
