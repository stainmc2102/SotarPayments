<svg width="1280" height="340" viewBox="0 0 1280 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#111C33"/>
      <stop offset="100%" stop-color="#1B2A4A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE28A"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <circle cx="1090" cy="90" r="220" fill="url(#glow)"/>
  <rect x="0" y="0" width="10" height="340" fill="url(#accent)"/>

  <!-- floating blocks (minecraft-ish) -->
  <g opacity="0.14">
    <rect x="960" y="40" width="46" height="46" rx="6" fill="#4ADE80"/>
    <rect x="1150" y="220" width="34" height="34" rx="6" fill="#22D3EE"/>
    <rect x="1030" y="230" width="26" height="26" rx="5" fill="#F5A623"/>
    <rect x="1200" y="70" width="22" height="22" rx="4" fill="#4ADE80"/>
  </g>

  <!-- coin badge -->
  <g transform="translate(1085,150)">
    <circle r="86" fill="url(#coin)" opacity="0.95"/>
    <circle r="86" fill="none" stroke="#FFF7E0" stroke-opacity="0.5" stroke-width="3"/>
    <text x="0" y="16" font-family="'Segoe UI', Arial, sans-serif" font-size="58" font-weight="800" fill="#7A4B00" text-anchor="middle">₫</text>
  </g>

  <!-- text block -->
  <g font-family="'Segoe UI', Arial, sans-serif">
    <text x="70" y="118" font-size="30" font-weight="700" letter-spacing="4" fill="#4ADE80">SOTAR STUDIO</text>
    <text x="68" y="180" font-size="64" font-weight="800" fill="#FFFFFF">SotarPayments</text>
    <text x="70" y="222" font-size="22" font-weight="400" fill="#B7C3DA">Cổng nạp Bank / Thẻ cào / Discord Auto Buy cho máy chủ Minecraft</text>

    <!-- pill badges -->
    <g font-size="16" font-weight="600" fill="#0B1220">
      <rect x="70" y="248" width="120" height="34" rx="17" fill="url(#accent)"/>
      <text x="130" y="270" text-anchor="middle">Paper / Folia</text>

      <rect x="200" y="248" width="118" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.92"/>
      <text x="259" y="270" text-anchor="middle">SePay · PayOS</text>

      <rect x="328" y="248" width="150" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.92"/>
      <text x="403" y="270" text-anchor="middle">Thẻ cào tự động</text>

      <rect x="488" y="248" width="150" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.92"/>
      <text x="563" y="270" text-anchor="middle">Discord Auto Buy</text>
    </g>
  </g>
</svg>
